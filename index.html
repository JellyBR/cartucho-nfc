<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    
    <!-- Bloqueio de Zoom e Escala Extrema -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    
    <!-- Link para o Manifesto Nativo -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Meta-tags de Imersão para iOS (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sistema">
    
    <title>Sistema de Execução</title>
    
    <style>
        /* Desativa seleções de texto acidentais durante o jogo */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: none; 
        }
        
        #game-container { width: 100vw; height: 100vh; position: relative; z-index: 1; }
        
        #power-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; }
        .cart-status { color: #00ff00; font-size: 1.2rem; margin-bottom: 40px; text-shadow: 0 0 10px #00ff00; text-transform: uppercase; }
        #power-btn { background-color: transparent; border: 3px solid #ff0000; color: #ff0000; padding: 15px 40px; font-size: 1.8rem; font-weight: bold; font-family: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: all 0.1s ease-in-out; }
        #power-btn:active { background-color: #ff0000; color: #000; transform: scale(0.95); }
        
        #loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .loader-text { color: #fff; font-size: 1.5rem; font-weight: bold; letter-spacing: 3px; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; text-shadow: 0 0 15px #fff; } 100% { opacity: 0.2; } }

        #status-msg { display: none; color: #fff; text-align: center; margin-top: 40vh; position: relative; z-index: 10; }
    </style>
</head>
<body>
    
    <div id="power-screen">
        <div class="cart-status">Conexão Estabelecida</div>
        <button id="power-btn">POWER ON</button>
    </div>

    <div id="loading-overlay">
        <div class="loader-text">DECODIFICANDO DADOS...</div>
    </div>

    <div id="game-container"><div id="game"></div></div>
    <div id="status-msg">Acesso Negado ou Dados Ausentes.</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        const sys = urlParams.get('c');
        const dataId = urlParams.get('id');

        if (sys && dataId) {
            document.getElementById('power-btn').addEventListener('click', function() {
                
                // INJEÇÃO TÁTICA: FORÇAR TELA CHEIA (FULLSCREEN API)
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) {
                    docElm.requestFullscreen().catch(err => console.warn(err));
                } else if (docElm.webkitRequestFullscreen) { /* Safari / iOS */
                    docElm.webkitRequestFullscreen();
                }
                
                document.getElementById('power-screen').style.display = 'none';
                document.getElementById('loading-overlay').style.display = 'flex';

                window.EJS_player = '#game';
                window.EJS_core = sys;
                window.EJS_gameUrl = `roms/${sys}/${dataId}`;
                window.EJS_startOnLoaded = true;
                window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
                
                window.EJS_onGameStart = function() {
                    document.getElementById('loading-overlay').style.display = 'none';
                    
                    // INICIA O RASTREAMENTO DINÂMICO DE LAYOUT
                    injetarLayoutTatico(sys);
                };

                const script = document.createElement('script');
                script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
                document.body.appendChild(script);
            });

        } else {
            document.getElementById('power-screen').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('status-msg').style.display = 'block';
        }
        
        // ==========================================================
        // MOTOR REATIVO DE LAYOUT (RASTREAMENTO BLINDADO)
        // ==========================================================
        function injetarLayoutTatico(coreName) {
            setInterval(() => {
                const gameContainer = document.getElementById('game');
                if (!gameContainer) return;
                
                const virtualButtons = Array.from(gameContainer.querySelectorAll('div, span'));
                
                let btnEsq = null, btnDir = null, btnSelect = null, btnStart = null;
                let btnA = null, btnB = null, btnX = null, btnY = null;
                
                // Mapeia e identifica todos os botões pela string de texto
                virtualButtons.forEach(btn => {
                    const txt = btn.innerText ? btn.innerText.trim() : '';
                    
                    // 1. ELIMINAÇÃO SUMÁRIA DA VELOCIDADE (Global para todos os consoles)
                    if (txt === 'Rápido' || txt === 'Lento') {
                        btn.style.setProperty('display', 'none', 'important');
                    }
                    
                    // 2. CAPTURA DOS NÓS ALVO
                    if (txt === 'ESQ') btnEsq = btn;
                    if (txt === 'DIR') btnDir = btn;
                    if (txt === 'Select') btnSelect = btn;
                    if (txt === 'Start') btnStart = btn;
                    if (txt === 'A') btnA = btn;
                    if (txt === 'B') btnB = btn;
                    if (txt === 'X') btnX = btn;
                    if (txt === 'Y') btnY = btn;
                });
                
                // 3. ANCORAGEM TÁTICA SNES
                if ((coreName === 'snes' || coreName === 'sfc') && btnEsq && btnDir && btnSelect && btnStart) {
                    const esqRect = btnEsq.getBoundingClientRect();
                    const dirRect = btnDir.getBoundingClientRect();
                    
                    if (esqRect.bottom > 0 && dirRect.bottom > 0) {
                        btnSelect.style.setProperty('position', 'fixed', 'important');
                        btnSelect.style.setProperty('top', (esqRect.bottom + 15) + 'px', 'important');
                        btnSelect.style.setProperty('left', esqRect.left + 'px', 'important');
                        btnSelect.style.setProperty('bottom', 'auto', 'important');
                        btnSelect.style.setProperty('right', 'auto', 'important');
                        btnSelect.style.setProperty('margin', '0', 'important');
                        btnSelect.style.setProperty('transform', 'none', 'important');
                        btnSelect.style.setProperty('z-index', '9999', 'important');
                        
                        btnStart.style.setProperty('position', 'fixed', 'important');
                        btnStart.style.setProperty('top', (dirRect.bottom + 15) + 'px', 'important');
                        btnStart.style.setProperty('left', 'auto', 'important');
                        const rightOffset = window.innerWidth - dirRect.right;
                        btnStart.style.setProperty('right', rightOffset + 'px', 'important');
                        btnStart.style.setProperty('bottom', 'auto', 'important');
                        btnStart.style.setProperty('margin', '0', 'important');
                        btnStart.style.setProperty('transform', 'none', 'important');
                        btnStart.style.setProperty('z-index', '9999', 'important');
                    }
                }

                // 4. ANCORAGEM TÁTICA ATARI 2600 (Acima dos controles inferiores)
                if (coreName === 'atari2600' && btnSelect && btnStart) {
                    // Agrupa os botões de ação encontrados na direita
                    const rightButtons = [btnA, btnB, btnX, btnY].filter(b => b !== null);

                    if (rightButtons.length > 0) {
                        let minTop = 9999;
                        let rightMost = 0;

                        // Localiza o botão mais alto e o mais à direita para criar a âncora
                        rightButtons.forEach(b => {
                            const rect = b.getBoundingClientRect();
                            if (rect.top > 0 && rect.top < minTop) minTop = rect.top;
                            if (rect.right > 0 && rect.right > rightMost) rightMost = rect.right;
                        });

                        if (minTop !== 9999) {
                            // Select: Posicionado acima do Direcional, usando a mesma altura dos botões de ação para simetria
                            btnSelect.style.setProperty('position', 'fixed', 'important');
                            btnSelect.style.setProperty('top', (minTop - 55) + 'px', 'important');
                            btnSelect.style.setProperty('left', '10%', 'important'); 
                            btnSelect.style.setProperty('bottom', 'auto', 'important');
                            btnSelect.style.setProperty('right', 'auto', 'important');
                            btnSelect.style.setProperty('margin', '0', 'important');
                            btnSelect.style.setProperty('transform', 'none', 'important');
                            btnSelect.style.setProperty('z-index', '9999', 'important');
                            
                            // Start (Reset): Posicionado logo acima do botão de ação da direita
                            btnStart.style.setProperty('position', 'fixed', 'important');
                            btnStart.style.setProperty('top', (minTop - 55) + 'px', 'important');
                            btnStart.style.setProperty('left', 'auto', 'important');
                            
                            // Alinha à direita acompanhando a margem do botão de ação
                            const rightOffset = window.innerWidth - rightMost;
                            btnStart.style.setProperty('right', (rightOffset > 0 ? rightOffset : 20) + 'px', 'important');
                            
                            btnStart.style.setProperty('bottom', 'auto', 'important');
                            btnStart.style.setProperty('margin', '0', 'important');
                            btnStart.style.setProperty('transform', 'none', 'important');
                            btnStart.style.setProperty('z-index', '9999', 'important');
                        }
                    }
                }

            }, 300); 
        }
    </script>
</body>
</html>
